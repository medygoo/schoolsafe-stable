<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SchoolSafe V2 — Test de carte élève</title>
  <link rel="stylesheet" href="assets/cards.css">
  <style>
    body { font-family: 'Nunito Sans', 'Segoe UI', sans-serif; background: #eef2f7; margin: 0; padding: 20px; color: #17203a; }
    h1 { font-size: 18px; margin: 0 0 8px; }
    p.hint { font-size: 12px; color: #5d6784; margin: 0 0 16px; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; background: #fff; padding: 12px 14px; border-radius: 14px; box-shadow: 0 2px 8px rgba(0,0,0,.06); margin-bottom: 16px; }
    .toolbar label { font-size: 12px; font-weight: 800; color: #5d6784; }
    .toolbar select, .toolbar button { font: inherit; font-size: 13px; padding: 7px 11px; border-radius: 9px; border: 1.5px solid #d4dbea; background: #fff; }
    .toolbar button { background: #17203a; color: #fff; border-color: #17203a; cursor: pointer; font-weight: 800; }
    .toolbar button.secondary { background: #fff; color: #17203a; }
    .toolbar button:disabled { opacity: .5; cursor: not-allowed; }
    .status { font-size: 12px; font-weight: 700; color: #08825a; min-height: 18px; }
    .studio-wrap { background: #fff; border-radius: 18px; padding: 18px; box-shadow: 0 4px 16px rgba(0,0,0,.06); }
    .ss-card-studio { padding: 14px 0; min-height: 420px; }
    .rendered { display: flex; flex-wrap: wrap; gap: 22px; justify-content: center; align-items: flex-start; }
    .ss-badge-wrap { width: 340px; height: 540px; }
    .ss-carte-wrap { width: 560px; height: 353px; }
  </style>
</head>
<body>
  <h1>🧪 Test visuel — Carte / Badge élève SchoolSafe V2</h1>
  <p class="hint">Ce fichier est autonome. Il utilise le CSS local, les assets patrimoine et les données de design du projet. Pour capturer le PNG, préférez l'ouverture via le serveur local plutôt que file://.</p>

  <div class="toolbar">
    <label>Classe test :</label>
    <select id="class-select">
      <option value="p3">3ᵉ Primaire — Badge vertical</option>
      <option value="p6">6ᵉ Primaire — Carte PVC horizontale</option>
      <option value="sec">4ᵉ Scientifique — Carte PVC horizontale</option>
    </select>

    <label>Famille :</label>
    <select id="fam-select"></select>

    <label>Variante :</label>
    <select id="variant-select"></select>

    <label>Patrimoine :</label>
    <select id="pat-style">
      <option value="vignette">Vignette</option>
      <option value="fond">Fond</option>
      <option value="both" selected>Vignette + Fond</option>
    </select>

    <button id="btn-render">Générer l'aperçu</button>
    <button id="btn-png" class="secondary">Télécharger PNG</button>
  </div>
  <div class="status" id="status"></div>

  <div class="studio-wrap">
    <div id="studio" class="ss-card-studio" data-fam="A">
      <div class="rendered" id="rendered">
        <div style="text-align:center;padding:40px;color:#888;font-size:13px">Cliquez sur « Générer l'aperçu »</div>
      </div>
    </div>
  </div>

  <!-- Libs externes -->
  <script src="../../vendor/qrcode.min.js"></script>
  <script src="../../vendor/html2canvas.min.js"></script>

  <!-- Données de design du projet -->
  <script type="module">
    import {
      CARD_FAMILIES,
      CARD_FAMILY_VARIANTS,
      CARD_PALETTE,
      ALL_PATRIMOINS,
      PATRIMOINE_STYLES
    } from './assets/card-data.js';

    // Rendre les données accessibles au script classique ci-dessous
    window._ssCARDS = {
      FAMS: CARD_FAMILIES,
      FVARS: CARD_FAMILY_VARIANTS,
      CCOLS: CARD_PALETTE,
      PATS: ALL_PATRIMOINS.map(p => ({ v: p.value, n: p.name }))
    };
    window._ssCardStyles = PATRIMOINE_STYLES;

    // Déclencher l'initialisation de l'UI
    document.dispatchEvent(new Event('ss-data-ready'));
  </script>

  <script>
    // ═══════════════════════════════════════════════════════════════════════
    // DONNÉES DE TEST
    // ═══════════════════════════════════════════════════════════════════════
    const TEST_SCHOOL = {
      name: 'Complexe Scolaire Le Sage',
      name_en: 'The Wise School International',
      address: '123 Avenue de la République, Kinshasa',
      phone: '+243 999 000 111',
      email: 'contact@lesage.schoolsafe.cd',
      motto: 'Excellence · Discipline · Avenir',
      website: 'www.lesage.schoolsafe.cd'
    };

    const TEST_TEACHER = { id: 't1', name: 'Mme Mbuyi' };

    const TEST_PARENT = { id: 'p1', name: 'Jean Kabongo', phone: '+243 888 123 456' };

    const TEST_AUTORISE = { sid: 's1', name: 'Marie Kabongo', phone: '+243 888 654 321', active: true };

    const TEST_CLASSES = {
      p3: {
        id: 'c-p3', name: '3ᵉ Primaire', cycle: 'primaire', option: '',
        teacher_id: 't1',
        card_family: 'A', card_variant: 0,
        card_color: '#1446aa', card_color_soft: '#dbe7fb', card_color_dark: '#0d2f77',
        card_pat: 'rdc-okapi', card_pat_style: 'both'
      },
      p6: {
        id: 'c-p6', name: '6ᵉ Primaire', cycle: 'primaire', option: '',
        teacher_id: 't1',
        card_family: 'C', card_variant: 1,
        card_color: '#7c3aed', card_color_soft: '#ede9fe', card_color_dark: '#5b21b6',
        card_pat: 'min-or', card_pat_style: 'both'
      },
      sec: {
        id: 'c-sec', name: '4ᵉ Scientifique', cycle: 'secondaire', option: 'Scientifique',
        teacher_id: 't1',
        card_family: 'D', card_variant: 0,
        card_color: '#c9a030', card_color_soft: '#fef3d0', card_color_dark: '#8a6b15',
        card_pat: 'ois-aigle', card_pat_style: 'both'
      }
    };

    const TEST_STUDENT = {
      id: 's1',
      name: 'Kabongo Lukusa Daniel',
      mat: 'LS-2026-0042',
      dob: '2015-03-12',
      photo: '', // laisse vide pour utiliser le placeholder
      cid: 'c-p3',
      pid: 'p1',
      nom_papa: 'Jean Kabongo',
      nom_maman: 'Marie Kabongo'
    };

    const ACADEMIC_YEAR = '2025-2026';

    // Mock global minimal
    window.SCHOOL_LOGO = '';
    window._schoolInfo = () => TEST_SCHOOL;
    window.DB = { users: [TEST_PARENT], aps: [TEST_AUTORISE] };

    // ═══════════════════════════════════════════════════════════════════════
    // HELPERS DE RENDU (adaptés du moteur historique)
    // ═══════════════════════════════════════════════════════════════════════
    function esc(s) {
      const d = document.createElement('div');
      d.textContent = (s == null ? '' : String(s));
      return d.innerHTML;
    }

    window.esc = esc;

    window.ssClassType = function (cl) {
      if (!cl) return { type: 'badge', colorIdx: 3, col: null };
      const cycle = cl.cycle || '', name = (cl.name || '').toLowerCase();
      let type = 'badge', colorIdx = 3;
      if (cycle === 'maternelle') {
        let ci = 2;
        if (name.includes('petite')) ci = 0;
        else if (name.includes('moyenne')) ci = 1;
        type = 'badge'; colorIdx = ci;
      } else if (cycle === 'humanites' || cycle === 'secondaire') {
        type = 'carte'; colorIdx = 9;
      } else {
        if (/\b5[eè°]/.test(name) || name.startsWith('5')) { type = 'carte'; colorIdx = 7; }
        else if (/\b6[eè°]/.test(name) || name.startsWith('6')) { type = 'carte'; colorIdx = 8; }
        else if (/\b1[eè°]/.test(name) || name.startsWith('1')) { type = 'badge'; colorIdx = 3; }
        else if (/\b2[eè°]/.test(name) || name.startsWith('2')) { type = 'badge'; colorIdx = 4; }
        else if (/\b3[eè°]/.test(name) || name.startsWith('3')) { type = 'badge'; colorIdx = 5; }
        else if (/\b4[eè°]/.test(name) || name.startsWith('4')) { type = 'badge'; colorIdx = 6; }
      }
      const col = cl.card_color
        ? { cc: cl.card_color, soft: cl.card_color_soft || '#e5e8eb', dark: cl.card_color_dark || '#1c242c' }
        : null;
      return { type, colorIdx, col };
    };

    window.ssGetPat = function (which) {
      const { PATS, FAMS } = window._ssCARDS;
      const fIdx = Math.max(0, FAMS.findIndex(f => f.id === (window._ssCardFam || 'A')));
      const cIdx = window._ssColorIdx || 3;
      // Sélection explicite : on ignore les <select> historiques et on utilise la classe
      return PATS[(fIdx * 13 + cIdx * 7 + (which === 'carte' ? 31 : 0)) % PATS.length];
    };

    window.ssGetClassPat = function (cl, which) {
      if (cl && cl.card_pat && cl.card_pat !== 'auto') {
        const found = (window._ssCARDS.PATS || []).find(p => p.v === cl.card_pat);
        if (found) return found;
      }
      return window.ssGetPat(which);
    };

    window.ssPatEl = function (p, size, center) {
      const px = p.v.startsWith('min-') ? 'PIERRE PRÉCIEUSE · ' : '';
      return `<div class="pat${center ? ' center' : ''}"><img style="width:${size}px;height:${size}px" src="assets/patrimoine/${esc(p.v)}.png" alt="${esc(p.n)}" onerror="this.style.visibility='hidden'"><span class="nm2">${esc((px + p.n).toUpperCase())}</span></div>`;
    };

    window.ssVeil = function (p, show) {
      if (!show) return '';
      const sl = p.v;
      const pos = sl.startsWith('min-') ? 'center' : 'center 12%';
      const sz = sl.startsWith('min-') ? 'cover' : '160%';
      return `<div class="patveil active" style="background-image:url('assets/patrimoine/${esc(sl)}.png');background-position:${pos};background-size:${sz}"></div>`;
    };

    window.ssGenQR = function (elId, data, size) {
      const el = document.getElementById(elId);
      if (!el || !window.QRCode) return;
      el.innerHTML = '';
      try {
        new QRCode(el, { text: data, width: size || 76, height: size || 76, colorDark: '#17203a', colorLight: '#ffffff' });
      } catch (e) {}
    };

    const SS_LOGO_SRC = '/schoolsafe-logo.png';
    const ssLogoBadge = `<img src="${SS_LOGO_SRC}" alt="SchoolSafe" style="height:18px;width:auto;object-fit:contain;filter:brightness(0) invert(1)">`;
    const ssLogoCarte = `<img src="${SS_LOGO_SRC}" alt="SchoolSafe" style="height:16px;width:auto;object-fit:contain;filter:brightness(0) invert(1)">`;

    window.ssBuildBadge = function (s, cl, teacher, year, patB, patStyle) {
      const showFond = patStyle === 'fond' || patStyle === 'both';
      const showVig = patStyle === 'vignette' || patStyle === 'both';
      const sc = window._schoolInfo(), logo = window.SCHOOL_LOGO;
      const snm = sc.name || "NOM DE L'ÉCOLE", clNm = cl ? cl.name : '—';
      const dob = s.dob ? s.dob.split('-').reverse().join('/') : '—';
      const tchr = teacher ? teacher.name : '—';
      const addr = sc.address || '', phone = sc.phone || '—', email = sc.email || '—', site = sc.website || sc.site || '';
      const par = (window.DB.users || []).find(u => u.id === s.pid);
      const parNm = par ? par.name : (s.nom_papa || s.nom_maman || '—'), parPh = par ? par.phone || '—' : '—';
      const ap = (window.DB.aps || []).filter(a => a.sid === s.id && a.active)[0];
      const apNm = ap ? ap.name : '—', apPh = ap ? ap.phone || '—' : '—';
      const mat = s.mat || s.id || '000';
      const pts = (s.name || '').trim().split(/\s+/);
      const n1 = pts[0] || '—', n2 = pts[1] || '', n3 = pts.slice(2).join(' ') || '';
      const sz = snm.length > 32 ? '11px' : snm.length > 22 ? '13px' : '15.5px';
      const logoH = logo
        ? `<div class="logo-slot" style="border:none;background:transparent;padding:0"><img src="${logo}" alt=""></div>`
        : '<div class="logo-slot"><span style="font-size:15px">🏫</span><span>LOGO<br>ÉCOLE</span></div>';
      const slg = sc.motto || sc.slogan || (logo ? '' : (sc.name_en || sc.sub || ''));
      const px = patB.v.startsWith('min-') ? 'PIERRE PRÉCIEUSE · ' : '';
      const vigEl = showVig ? window.ssPatEl(patB, 52, true) : '';
      const nmEl = `<div class="pat center" style="margin:0"><span class="nm2">${esc((px + patB.n).toUpperCase())}</span></div>`;
      const bottomEl = showVig ? vigEl : (showFond ? nmEl : '');
      const rectoOverlay = bottomEl ? `<div style="position:absolute;bottom:58px;left:50%;transform:translateX(-50%);z-index:10;pointer-events:none">${bottomEl}</div>` : '';

      const recto = `<div class="art badge" id="ss-br">
  <div class="head">
    <div class="arc"><i></i><i></i><i></i><i></i><i></i></div>
    <div class="head-row">${logoH}<div class="school"><div class="rdc">Rép. Démocratique du Congo</div><div class="nm" style="font-size:${sz}">${esc(snm)}</div>${slg ? `<div class="slg">${esc(slg)}</div>` : ''}</div><div class="flag"></div></div>
    <div class="rolebar">BADGE ÉLÈVE</div>
  </div>
  <div class="bodyz">
    ${showFond ? window.ssVeil(patB, true) : ''}
    <div class="brow">
      <div class="pcol">
        <div class="photo-wrap">
          <div class="photo">${s.photo ? `<img src="${esc(s.photo)}" alt="">` : '<div class="ph"><svg viewBox="0 0 100 100"><circle cx="50" cy="36" r="17" fill="#a9b6d3"/><path d="M18 88c4-20 17-30 32-30s28 10 32 30z" fill="#a9b6d3"/></svg></div>'}</div>
        </div>
        <div class="qr-side" id="ss-qr-br"></div>
        <b class="scan">SCAN ENTRÉE / SORTIE</b>
      </div>
      <div class="fcol">
        <div class="frw"><div class="ic" style="background:#d5f2f5;color:#0f7f8f">👤</div><div style="flex:1;min-width:0"><div class="k">Nom</div><div class="v">${esc(n1)}</div></div></div>
        <div class="frw"><div class="ic" style="background:#ffe8d9;color:#e8590c">👤</div><div style="flex:1;min-width:0"><div class="k">Post-nom</div><div class="v">${esc(n2 || '—')}</div></div></div>
        <div class="frw"><div class="ic" style="background:#ece5fb;color:#7b5cd6">👤</div><div style="flex:1;min-width:0"><div class="k">Prénom</div><div class="v">${esc(n3 || '—')}</div></div></div>
        <div class="frw"><div class="ic" style="background:#dbe7fb;color:#1446aa">🎫</div><div style="flex:1;min-width:0"><div class="k">Matricule</div><div class="v">${esc(s.mat || '—')}</div></div></div>
        <div class="frw"><div class="ic" style="background:#fdf3d1;color:#b8860b">🏫</div><div style="flex:1;min-width:0"><div class="k">Classe</div><div class="v">${esc(clNm)}</div></div></div>
        <div class="frw"><div class="ic" style="background:#fce4f1;color:#d63384">🎂</div><div style="flex:1;min-width:0"><div class="k">Date de naissance</div><div class="v">${esc(dob)}</div></div></div>
        <div class="frw"><div class="ic" style="background:#d7f3e7;color:#08825a">📚</div><div style="flex:1;min-width:0"><div class="k">Année scolaire</div><div class="v">${esc(year)}</div></div></div>
        <div class="frw"><div class="ic" style="background:#ffe9f1;color:#d6336c">🍎</div><div style="flex:1;min-width:0"><div class="k">Enseignant(e)</div><div class="v">${esc(tchr)}</div></div></div>
      </div>
    </div>
    <span class="deco" style="top:4px;right:8px;font-size:20px;transform:rotate(10deg)">A</span>
    <span class="deco" style="top:30px;right:26px;font-size:13px;transform:rotate(-14deg)">b</span>
    <span class="deco" style="bottom:46px;left:8px;font-size:17px;transform:rotate(8deg)">c</span>
    <div class="foot" style="position:absolute;bottom:0;left:-18px;right:-18px;z-index:20"><div style="height:22px;display:flex;align-items:center;padding:0 4px">${ssLogoBadge}</div><div><div class="t1">Sécurisé par SchoolSafe</div><div class="t2">un enfant protégé, un parent informé</div></div><span style="margin-left:auto;background:rgba(255,255,255,.18);border:1.5px solid rgba(255,255,255,.3);border-radius:999px;padding:3px 10px;font-family:'Baloo 2',cursive;font-size:10px;font-weight:900;letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px">${esc(clNm)}</span></div>
  </div>
  ${rectoOverlay}
</div>`;

      const verso = `<div class="art badge verso" id="ss-bv">
  <div class="head" style="padding-bottom:16px">
    <div class="arc"><i></i><i></i><i></i><i></i><i></i></div>
    <div class="head-row">${logoH}<div class="school"><div class="rdc">République Démocratique du Congo</div><div class="nm" style="font-size:${sz}">${esc(snm)}</div></div><div class="flag"></div></div>
  </div>
  <div class="bodyz">
    ${showFond ? window.ssVeil(patB, true) : ''}
    <div class="qr-big" id="ss-qr-bv"></div>
    <div class="qr-cap">Scan entrée / sortie · Matricule <b>${esc(s.mat || '—')}</b></div>
    <div class="rows">
      <div class="rw"><div class="ic" style="background:#d5f2f5;color:#0f7f8f">👨‍👩‍👧</div><div class="grow"><div class="k">Parent / Tuteur</div><div class="v">${esc(parNm)}</div></div><div style="flex:none"><div class="k">Téléphone</div><div class="v">${esc(parPh)}</div></div></div>
      <div class="rw"><div class="ic" style="background:#ece5fb;color:#7b5cd6">🛡️</div><div class="grow"><div class="k">Personne autorisée</div><div class="v">${esc(apNm)}</div></div><div style="flex:none"><div class="k">Téléphone</div><div class="v">${esc(apPh)}</div></div></div>
      <div class="rw ecole"><div class="ic" style="background:#dbe7fb;color:#1446aa">🏫</div><div class="grow">
        <div class="k">Contacter l'école</div>
        ${addr ? `<div class="v">${esc(addr)}</div>` : ''}
        <div class="v">${esc(phone)}</div>
        ${email && email !== '—' ? `<div class="v">${esc(email)}</div>` : ''}
        ${site ? `<div class="v">${esc(site)}</div>` : ''}
        <div class="v" style="color:#0b6e4f;font-weight:900">schoolsafe1@gmail.com</div>
      </div></div>
    </div>
    <div class="sec-note"><b>🛡️</b> En cas de perte, contactez la direction de l'école.</div>
    <div class="sign-row"><div class="sg"><div class="line"></div><b>SIGNATURE</b></div><div class="stamp">SCEAU<br>DE<br>L'ÉCOLE</div><div class="sg"><div class="line"></div><b>DIRECTEUR(TRICE)</b></div></div>
    <div class="foot" style="margin:auto -18px -8px"><div style="height:22px;display:flex;align-items:center;padding:0 4px">${ssLogoBadge}</div><div><div class="t1">Sécurisé par SchoolSafe</div><div class="t2">un enfant protégé, un parent informé</div></div></div>
  </div>
</div>`;
      return { recto, verso, qr: 'schoolsafe://student/' + mat };
    };

    window.ssBuildCarte = function (s, cl, teacher, year, patC, patStyle) {
      const showFond = patStyle === 'fond' || patStyle === 'both';
      const showVig = patStyle === 'vignette' || patStyle === 'both';
      const sc = window._schoolInfo(), logo = window.SCHOOL_LOGO;
      const snm = sc.name || "NOM DE L'ÉCOLE", clNm = cl ? cl.name : '—';
      const addr = sc.address || "Adresse de l'école", phone = sc.phone || '—', email = sc.email || '—', site = sc.website || sc.site || '';
      const dob = s.dob ? s.dob.split('-').reverse().join('/') : '—', tchr = teacher ? teacher.name : '—', opt = cl ? cl.option || '' : '';
      const mat = s.mat || s.id || '000';
      const par = (window.DB.users || []).find(u => u.id === s.pid);
      const parNm = par ? par.name : (s.nom_papa || s.nom_maman || '—'), parPh = par ? par.phone || '—' : '—';
      const ap = (window.DB.aps || []).filter(a => a.sid === s.id && a.active)[0];
      const apNm = ap ? ap.name : '—', apPh = ap ? ap.phone || '—' : '—';
      const pts = (s.name || '').trim().split(/\s+/);
      const dispNm = pts.slice(0, 2).join(' '), fn = pts.slice(2).join(' ') || '';
      const sz = snm.length > 32 ? '11px' : snm.length > 22 ? '13px' : '17px';
      const logoH = logo
        ? `<div class="logo-slot" style="border:none;background:transparent;padding:0"><img src="${logo}" alt=""></div>`
        : '<div class="logo-slot"><span style="font-size:15px">🏫</span><span>LOGO<br>ÉCOLE</span></div>';
      const slg = sc.motto || sc.slogan || (logo ? '' : (sc.name_en || sc.sub || ''));
      const px = patC.v.startsWith('min-') ? 'PIERRE PRÉCIEUSE · ' : '';
      const nmEl = `<div class="pat" style="margin-top:auto;padding:2px 0"><span class="nm2">${esc((px + patC.n).toUpperCase())}</span></div>`;

      const recto = `<div class="art carte" id="ss-cr">
  <div class="head"><div class="arc"><i></i><i></i><i></i><i></i><i></i></div>${logoH}<div class="school"><div class="rdc">République Démocratique du Congo</div><div class="nm" style="font-size:${sz}">${esc(snm)}</div>${slg ? `<div class="slg">${esc(slg)}</div>` : ''}${site ? `<div class="slg" style="font-weight:800">${esc(site)}</div>` : ''}</div><div class="flag"></div></div>
  <div class="titlebar"><span class="tb-type">CARTE D'ÉLÈVE</span><span class="tb-cls">${esc(clNm)}</span></div>
  <div class="bodyz">
    ${showFond ? window.ssVeil(patC, true) : ''}
    <div class="photo-col">
      <div class="photo">${s.photo ? `<img src="${esc(s.photo)}" alt="">` : '<div class="ph"><svg viewBox="0 0 100 100"><circle cx="50" cy="36" r="17" fill="#a9b6d3"/><path d="M18 88c4-20 17-30 32-30s28 10 32 30z" fill="#a9b6d3"/></svg></div>'}</div>
    </div>
    <div class="info">
      <div class="sname"><div class="n1">${esc(dispNm)}</div>${fn ? `<div class="n2">${esc(fn)}</div>` : ''}</div>
      <div class="grid">
        <div class="cell"><div class="k">Matricule</div><div class="v">${esc(s.mat || '—')}</div></div>
        <div class="cell"><div class="k">Né(e) le</div><div class="v">${esc(dob)}</div></div>
        ${opt ? `<div class="cell"><div class="k">Option</div><div class="v">${esc(opt)}</div></div>` : '<div class="cell"></div>'}
        <div class="cell"><div class="k">Année scolaire</div><div class="v">${esc(year)}</div></div>
        <div class="cell"><div class="k">Titulaire</div><div class="v">${esc(tchr)}</div></div>
        <div class="cell"><div class="k">N° Direction</div><div class="v">${esc(phone)}</div></div>
      </div>
      ${showVig ? window.ssPatEl(patC, 38, false) : (showFond ? nmEl : '')}
    </div>
    <div class="qr-col"><div class="qr-box" id="ss-qr-cr"></div><b>SCAN ENTRÉE / SORTIE</b></div>
  </div>
  <div class="foot"><div style="height:20px;display:flex;align-items:center;padding:0 4px">${ssLogoCarte}</div><div><div class="t1">SchoolSafe</div><div class="t2">un enfant protégé, un parent informé</div></div><div class="val">VALIDE ${esc(year)}</div></div>
</div>`;

      const verso = `<div class="art carte verso" id="ss-cv">
  <div class="head" style="padding:10px 18px">${logo ? `<div class="logo-slot" style="width:36px;height:36px;border:none;background:transparent;padding:0"><img src="${logo}" alt=""></div>` : '<div class="logo-slot" style="width:36px;height:36px;font-size:11px"><span>LOGO</span></div>'}<div class="school"><div class="rdc">En cas de perte, merci de restituer à :</div><div class="nm" style="font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(snm)}${addr ? ' — ' + esc(addr) : ''}</div></div><div class="flag"></div></div>
  <div class="bodyz">
    ${showFond ? window.ssVeil(patC, true) : ''}
    <div class="vleft">
      <div class="mini-rows">
        <div class="mrw"><div class="ic">👨‍👩‍👧</div><div style="flex:1"><div class="k">Parent / Tuteur</div><div class="v">${esc(parNm)}</div></div><div><div class="k">Tél</div><div class="v">${esc(parPh)}</div></div></div>
        <div class="mrw"><div class="ic">🛡️</div><div style="flex:1"><div class="k">Personne autorisée</div><div class="v">${esc(apNm)}</div></div><div><div class="k">Tél</div><div class="v">${esc(apPh)}</div></div></div>
        <div class="mrw ecole"><div class="ic">🏫</div><div style="flex:1;min-width:0">
          <div class="k">Contacter l'école</div>
          <div class="v">${esc(phone)}</div>
          ${email && email !== '—' ? `<div class="v">${esc(email)}</div>` : ''}
          ${site ? `<div class="v">${esc(site)}</div>` : ''}
          <div class="v" style="color:#0b6e4f;font-weight:900">schoolsafe1@gmail.com</div>
        </div><div style="flex:none"><div class="k">Année</div><div class="v">${esc(year)}</div></div></div>
      </div>
      <div class="sec-note" style="margin-top:auto"><b>🛡️</b> Accès contrôlé par scan SchoolSafe.</div>
    </div>
    <div class="vright">
      <div class="qr-box" style="width:110px;height:110px" id="ss-qr-cv"></div>
      <b style="font-size:7.5px;color:#5d6784;letter-spacing:.8px;font-weight:900">VÉRIFICATION SCHOOLSAFE</b>
      <div class="stamp">SCEAU<br>DE<br>L'ÉCOLE</div>
    </div>
  </div>
  <div class="foot"><div style="height:20px;display:flex;align-items:center;padding:0 4px">${ssLogoCarte}</div><div><div class="t1">SchoolSafe</div><div class="t2">${site ? esc(site) : 'www.schoolsafe.cd'}</div></div><div class="val">N° ${esc(s.mat || '—')}</div></div>
</div>`;
      return { recto, verso, qr: 'schoolsafe://student/' + mat };
    };

    // ═══════════════════════════════════════════════════════════════════════
    // UI
    // ═══════════════════════════════════════════════════════════════════════
    const $ = id => document.getElementById(id);
    const statusEl = $('status');

    function setStatus(msg, type = 'ok') {
      statusEl.textContent = msg;
      statusEl.style.color = type === 'error' ? '#c22f2f' : '#08825a';
    }

    function populateSelects() {
      const famSel = $('fam-select');
      const varSel = $('variant-select');
      famSel.innerHTML = '';
      window._ssCARDS.FAMS.forEach(f => {
        const opt = document.createElement('option');
        opt.value = f.id;
        opt.textContent = `${f.id} — ${f.name}`;
        famSel.appendChild(opt);
      });

      function refreshVariants() {
        const fam = famSel.value;
        const variants = window._ssCARDS.FVARS[fam] || [];
        varSel.innerHTML = '';
        variants.forEach((v, i) => {
          const opt = document.createElement('option');
          opt.value = i;
          opt.textContent = `${i + 1} — ${v.label}`;
          varSel.appendChild(opt);
        });
      }
      famSel.addEventListener('change', refreshVariants);
      refreshVariants();
    }

    function getActiveClass() {
      const key = $('class-select').value;
      const base = TEST_CLASSES[key];
      return {
        ...base,
        card_family: $('fam-select').value,
        card_variant: parseInt($('variant-select').value, 10),
        card_pat_style: $('pat-style').value
      };
    }

    function render() {
      const cl = getActiveClass();
      window._ssCardFam = cl.card_family;
      const { type, colorIdx, col } = window.ssClassType(cl);
      window._ssColorIdx = colorIdx;

      const palette = col || window._ssCARDS.CCOLS[colorIdx] || window._ssCARDS.CCOLS[3];
      const studio = $('studio');
      studio.setAttribute('data-fam', cl.card_family);
      studio.style.setProperty('--ss-cc', palette.cc);
      studio.style.setProperty('--ss-cc-soft', palette.soft);
      studio.style.setProperty('--ss-cc-dark', palette.dark);

      const rendered = $('rendered');
      const patStyle = cl.card_pat_style;

      if (type === 'badge') {
        const patB = window.ssGetClassPat(cl, 'badge');
        const { recto, verso, qr } = window.ssBuildBadge(TEST_STUDENT, cl, TEST_TEACHER, ACADEMIC_YEAR, patB, patStyle);
        rendered.innerHTML = `<div class="ss-badge-wrap">${recto}</div><div class="ss-badge-wrap">${verso}</div>`;
        setTimeout(() => {
          window.ssGenQR('ss-qr-br', qr, 76);
          window.ssGenQR('ss-qr-bv', qr, 76);
        }, 40);
        setStatus(`Badge généré — famille ${cl.card_family}, variante ${cl.card_variant + 1}, patrimoine ${patB.n}, style ${patStyle}`);
      } else {
        const patC = window.ssGetClassPat(cl, 'carte');
        const { recto, verso, qr } = window.ssBuildCarte(TEST_STUDENT, cl, TEST_TEACHER, ACADEMIC_YEAR, patC, patStyle);
        rendered.innerHTML = `<div class="ss-carte-wrap">${recto}</div><div class="ss-carte-wrap">${verso}</div>`;
        setTimeout(() => {
          window.ssGenQR('ss-qr-cr', qr, 76);
          window.ssGenQR('ss-qr-cv', qr, 92);
        }, 40);
        setStatus(`Carte PVC générée — famille ${cl.card_family}, variante ${cl.card_variant + 1}, patrimoine ${patC.n}, style ${patStyle}`);
      }
    }

    async function downloadPNG() {
      const target = document.querySelector('#rendered .art');
      if (!target) { setStatus('Aucune carte à exporter.', 'error'); return; }
      if (typeof html2canvas !== 'function') { setStatus('html2canvas non chargé.', 'error'); return; }
      const cl = getActiveClass();
      const { type } = window.ssClassType(cl);
      setStatus('Génération PNG en cours…');
      try {
        const canvas = await html2canvas(target, { scale: 2, useCORS: true, allowTaint: true, backgroundColor: '#ffffff' });
        const a = document.createElement('a');
        const suffix = type === 'badge' ? 'badge' : 'carte';
        a.download = `TEST-${TEST_STUDENT.name.replace(/\s+/g, '_')}-${suffix}-SchoolSafe.png`;
        a.href = canvas.toDataURL('image/png');
        a.click();
        setStatus('PNG téléchargé ✓');
      } catch (e) {
        setStatus('Erreur PNG : ' + e.message, 'error');
      }
    }

    function init() {
      populateSelects();
      $('btn-render').addEventListener('click', render);
      $('btn-png').addEventListener('click', downloadPNG);
      // Sélectionner par défaut la famille/variante de la classe active
      const key = $('class-select').value;
      const base = TEST_CLASSES[key];
      $('fam-select').value = base.card_family;
      $('fam-select').dispatchEvent(new Event('change'));
      $('variant-select').value = String(base.card_variant);
      $('pat-style').value = base.card_pat_style;
      render();
    }

    if (window._ssCARDS) {
      init();
    } else {
      document.addEventListener('ss-data-ready', init);
    }
  </script>
</body>
</html>
