<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SchoolSafe — vérifier la connexion</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e9f3fc;color:#153360;font:15px system-ui}header{padding:20px;background:white;border-bottom:1px solid #d0e3f4}h1{font-size:22px;margin:0 0 8px}p{margin:0 0 14px;line-height:1.5}nav{display:flex;gap:8px;flex-wrap:wrap}button,a{font:inherit}button{padding:10px 14px;border:1px solid #abcce7;border-radius:12px;background:white;color:#153360;cursor:pointer}button[aria-pressed=true]{background:#146cf2;color:white;border-color:#146cf2}a{color:#145dca}main{padding:20px;max-width:1420px;margin:auto}figure{margin:0 auto;max-width:1366px}img{display:block;width:100%;height:auto;border-radius:18px;box-shadow:0 12px 40px #477fac26}figure.phone{max-width:390px}figcaption{margin:14px 0;line-height:1.5}.state{margin:14px 0;display:flex;gap:8px}button:focus-visible,a:focus-visible{outline:3px solid #07a9e8;outline-offset:3px}
</style></head><body>
<header><h1>SchoolSafe · contrôle des présentations</h1><p>Captures de la version corrigée. Pour voir les animations et écrire dans le formulaire, <a href="./index.html?revision=connexion-responsive-10-final">ouvrir SchoolSafe</a>, puis appuyer sur « Commencer ».</p>
<nav aria-label="Vue"><button data-view="desktop" aria-pressed="true">Ordinateur</button><button data-view="phone1" aria-pressed="false">Téléphone · Jaspe entière</button><button data-view="phone2" aria-pressed="false">Téléphone · Buste</button></nav></header>
<main><div class="state" aria-label="État"><button data-state="accueil" aria-pressed="true">Accueil</button><button data-state="saisie" aria-pressed="false">Pendant la saisie</button></div><figure><img width="1366" height="768" alt="Jaspe entière à côté du formulaire sur ordinateur"><figcaption></figcaption></figure></main>
<script>
const views={desktop:{file:'ordinateur',phone:false,label:'Ordinateur : Jaspe entière reste à côté pendant la saisie.'},phone1:{file:'telephone-entier',phone:true,label:'Téléphone : Jaspe entière à côté. Dès la saisie, le formulaire remonte et prend toute la largeur.'},phone2:{file:'telephone-buste',phone:true,label:'Téléphone : Jaspe en buste au-dessus. Dès la saisie, Jaspe disparaît et le formulaire prend sa place.'}};
let selected='desktop',state='accueil';
function show(){const view=views[selected];document.querySelector('figure').classList.toggle('phone',view.phone);const img=document.querySelector('img');img.src='./assets/connexion-controle/'+view.file+'-'+state+'.png';img.alt=view.label+' Capture : '+state;img.width=view.phone?390:1366;img.height=view.phone?844:768;document.querySelector('figcaption').textContent=view.label;for(const b of document.querySelectorAll('[data-view]'))b.setAttribute('aria-pressed',String(b.dataset.view===selected));for(const b of document.querySelectorAll('[data-state]'))b.setAttribute('aria-pressed',String(b.dataset.state===state));}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.view)selected=b.dataset.view;if(b.dataset.state)state=b.dataset.state;show();});show();
</script></body></html>
