name: Deploy production after CI

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [production]

permissions:
  contents: read
  actions: read

concurrency:
  group: schoolsafe-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      ${{ vars.SCHOOLSAFE_DEPLOY_ENABLED == 'true'
          && github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.event == 'push'
          && github.event.workflow_run.head_branch == 'production' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout production history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: production
          fetch-depth: 0
          persist-credentials: false

      - name: Validate exact production SHA and triggering CI
        shell: bash
        env:
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          [[ "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]

          test "$(git rev-parse origin/production)" = "$COMMIT_SHA"

          test "$(
            gh api "/repos/${GITHUB_REPOSITORY}/git/ref/heads/production" --jq .object.sha
          )" = "$COMMIT_SHA"

          test "$(
            gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${CI_RUN_ID}" --jq .name
          )" = "CI"

          test "$(
            gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${CI_RUN_ID}" --jq .event
          )" = "push"

          test "$(
            gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${CI_RUN_ID}" --jq .head_branch
          )" = "production"

          test "$(
            gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${CI_RUN_ID}" --jq .head_sha
          )" = "$COMMIT_SHA"

          test "$(
            gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${CI_RUN_ID}" --jq .conclusion
          )" = "success"

      - name: Invoke restricted VPS deployer
        shell: bash
        env:
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
          DEPLOY_KEY: ${{ secrets.SCHOOLSAFE_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.SCHOOLSAFE_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          [[ "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]
          test -n "$DEPLOY_KEY"
          test -n "$KNOWN_HOSTS"

          key_file="$(mktemp)"
          hosts_file="$(mktemp)"
          trap 'rm -f "$key_file" "$hosts_file"' EXIT

          printf '%s\n' "$DEPLOY_KEY" > "$key_file"
          printf '%s\n' "$KNOWN_HOSTS" > "$hosts_file"

          chmod 600 "$key_file" "$hosts_file"

          deploy_output="$(
            ssh \
              -i "$key_file" \
              -o IdentitiesOnly=yes \
              -o BatchMode=yes \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$hosts_file" \
              schoolsafe-deploy@179.198.195.15 \
              "sudo /usr/local/sbin/approve-schoolsafe-sha '$COMMIT_SHA' && sudo /usr/local/sbin/deploy-schoolsafe '$COMMIT_SHA'"
          )"

          printf '%s\n' "$deploy_output"

          grep -Fqx \
            "schoolsafe deployed successfully at $COMMIT_SHA" \
            <<<"$deploy_output"

          {
            echo "### SchoolSafe automatic production deployment"
            echo "- Triggering CI run: `$CI_RUN_ID`"
            echo "- Requested SHA: `$COMMIT_SHA`"
            echo "- Confirmed deployed SHA: `$COMMIT_SHA`"
            echo "- Remote account: `schoolsafe-deploy`"
          } >> "$GITHUB_STEP_SUMMARY"
